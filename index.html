<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BullionVault — Zero-API Gold & Silver Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // One-time cleanup of old localStorage keys that caused false SHA-256 duplicate blocks
    const CLEANUP_FLAG = "bv_legacy_cleaned_v4";
    if (!localStorage.getItem(CLEANUP_FLAG)) {
      [
        "bullion_vault_txs_v2", "bullion_vault_hashes_v2",
        "bullion_vault_txs_v3_no23oct", "bullion_vault_hashes_v3_no23oct",
        "bullion_vault_txs_clean_v1", "bullion_vault_hashes_clean_v1",
        "bullion_vault_txs_gist_v1", "bullion_vault_hashes_gist_v1",
        "bullion_vault_txs_pwd_v1", "bullion_vault_hashes_pwd_v1",
        "bv_txs_v2", "bv_hashes_v2", "bv_clean_txs_v1", "bv_clean_hashes_v1"
      ].forEach(k => localStorage.removeItem(k));
      localStorage.setItem(CLEANUP_FLAG, "true");
    }

    const STORAGE_TX_KEY = "bv_fresh_txs_v4";
    const STORAGE_PWD_KEY = "bv_fresh_pwd_v4";
    const CLOUD_SYNC_RELAY = "https://ntfy.sh";

    async function computeFileHash(file) {
      const buffer = await file.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // 1. Decode exact Date & Time embedded inside PhonePe Transaction ID (e.g. NB261023174548...)
    function decodePhonePeTxTimestamp(txId) {
      if (!txId) return null;
      const m = String(txId).trim().toUpperCase().match(/^(?:NB|T)(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\d+$/);
      if (!m) return null;
      const year = 2000 + parseInt(m[1], 10);
      const month = parseInt(m[2], 10);
      const day = parseInt(m[3], 10);
      const hour24 = parseInt(m[4], 10);
      const minute = parseInt(m[5], 10);
      if (month < 1 || month > 12 || day < 1 || day > 31 || hour24 > 23 || minute > 59) return null;

      const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const period = hour24 >= 12 ? "pm" : "am";
      const hour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;
      const timeStr = `${String(hour12).padStart(2, "0")}:${String(minute).padStart(2, "0")} ${period}`;
      return { date: dateStr, time: timeStr };
    }

    // 2. Fallback: Decode Date & Time from Android Screenshot filename if needed
    function decodeFilenameTimestamp(fileName = "") {
      const m = fileName.match(/(\d{4})-(\d{2})-(\d{2})-(\d{2})-(\d{2})-(\d{2})/);
      if (!m) return null;
      const year = m[1], month = m[2], day = m[3];
      const hour24 = parseInt(m[4], 10);
      const minute = m[5];
      if (hour24 > 23) return null;
      const period = hour24 >= 12 ? "pm" : "am";
      const hour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;
      return {
        date: `${year}-${month}-${day}`,
        time: `${String(hour12).padStart(2, "0")}:${minute} ${period}`
      };
    }

    function to24HourTime(timeStr = "12:00 pm") {
      const m = String(timeStr).trim().match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);
      if (!m) return "12:00";
      let h = parseInt(m[1], 10);
      const min = m[2];
      const mer = (m[3] || "pm").toLowerCase();
      if (mer === "pm" && h < 12) h += 12;
      if (mer === "am" && h === 12) h = 0;
      return `${String(h).padStart(2, "0")}:${min}`;
    }

    // Smart RegEx + Math Cross-Verification Parser for PhonePe Receipts
    function parsePhonePeOCRText(rawText, fileName = "") {
      const text = rawText.replace(/\r/g, " ");

      const isGold = /Gold\s*Purchase|Rate\s*of\s*gold|Gold\s*Weight|Gold\s*value/i.test(text);
      const isSilver = /Silver\s*Purchase|Rate\s*of\s*silver|Silver\s*Weight|Silver\s*value/i.test(text);
      const metal = isGold ? "Gold" : isSilver ? "Silver" : "Silver";
      const provider = /MMTC[\s-]*PAMP/i.test(text) ? "MMTC-PAMP" : "SafeGold";

      // Extract PhonePe Transaction ID (tolerant of spaces or 'O' -> '0' inside ID)
      const cleanedForId = text.replace(/NB\s+/gi, "NB").replace(/NB([0-9O]{18,28})/gi, (full) => full.replace(/O/gi, "0"));
      const txIdMatch = cleanedForId.match(/\b(NB\d{18,28}|T\d{18,28})\b/i);
      const transactionId = txIdMatch ? txIdMatch[1].toUpperCase() : "";

      const decodedTx = decodePhonePeTxTimestamp(transactionId);
      const decodedFile = decodeFilenameTimestamp(fileName);

      let dateStr = decodedTx?.date || decodedFile?.date || new Date().toISOString().slice(0, 10);
      let timeStr = decodedTx?.time || decodedFile?.time || "12:00 pm";

      // Extract Date & Time from Receipt Header ("05:45 pm on 23 Oct 2026")
      const normalizedHeader = text.replace(/\b[QO](\d[:.]\d{2})/g, "0$1");
      const bannerTimeMatch =
        normalizedHeader.match(/([0-1]?\d)\s*[:.]\s*([0-5]\d)\s*(am|pm)\s*(?:on\b)?/i) ||
        normalizedHeader.match(/([0-1]?\d)\s*[:.]\s*([0-5]\d)\s*([ap]\.?m\.?)/i);

      if (bannerTimeMatch) {
        const hh = bannerTimeMatch[1].padStart(2, "0");
        const mm = bannerTimeMatch[2].padStart(2, "0");
        const mer = bannerTimeMatch[3].replace(/\./g, "").toLowerCase();
        timeStr = `${hh}:${mm} ${mer}`;
      }

      const dateMatch = normalizedHeader.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{4})/i);
      if (dateMatch) {
        const months = { jan:"01", feb:"02", mar:"03", apr:"04", may:"05", jun:"06", jul:"07", aug:"08", sep:"09", oct:"10", nov:"11", dec:"12" };
        const day = dateMatch[1].padStart(2, "0");
        const mon = months[dateMatch[2].toLowerCase().slice(0, 3)] || "01";
        const yr = dateMatch[3];
        dateStr = `${yr}-${mon}-${day}`;
      }

      // Guarantee exact timestamp if PhonePe Transaction ID is present
      if (decodedTx) {
        if (!bannerTimeMatch) timeStr = decodedTx.time;
        if (!dateMatch) dateStr = decodedTx.date;
      }

      let weightGrams = 0;
      const weightMatches = [...text.matchAll(/(?:Weight|weight)[^\d]*?(0\.\d{2,5})\s*g/gi)];
      if (weightMatches.length > 0) {
        weightGrams = parseFloat(weightMatches[0][1]);
      } else {
        const fallbackWeight = text.match(/\b(0\.\d{3,5})\s*g\b/i);
        if (fallbackWeight) weightGrams = parseFloat(fallbackWeight[1]);
      }

      const cleanCurrency = (rawNumStr, expectedVal = null) => {
        if (!rawNumStr) return 0;
        const cleaned = rawNumStr.replace(/[,₹Rs\s]/gi, "");
        const num = parseFloat(cleaned);
        if (isNaN(num)) return 0;
        if (expectedVal && expectedVal > 0) {
          const strippedFirst = parseFloat(cleaned.slice(1));
          if (!isNaN(strippedFirst) && Math.abs(strippedFirst - expectedVal) < Math.abs(num - expectedVal)) {
            return strippedFirst;
          }
        }
        return num;
      };

      let totalAmount = 0;
      const totalMatch = text.match(/Total\s*amount[^\d]*([\d,]+\.?\d*)/i);
      if (totalMatch) {
        totalAmount = parseFloat(totalMatch[1].replace(/,/g, ""));
        if (totalAmount > 200 && [210, 220, 230, 240, 250, 710, 720, 730, 740, 750].includes(totalAmount)) {
          totalAmount = totalAmount % 100;
        }
      }

      let gst = 0;
      const gstMatch = text.match(/GST[^\d]*([\d]+\.\d{2})/i);
      if (gstMatch) {
        gst = parseFloat(gstMatch[1]);
        if (gst > 10 && (String(gst).startsWith("2") || String(gst).startsWith("7"))) {
          gst = parseFloat(String(gst).slice(1));
        }
      }

      let metalValue = 0;
      const valMatch = text.match(/value\s*of\s*0\.\d+g[^\d]*([\d,]+\.\d{2})/i);
      if (valMatch) {
        const expectedVal = totalAmount > 0 && gst > 0 ? (totalAmount - gst) : null;
        metalValue = cleanCurrency(valMatch[1], expectedVal);
      }

      if (metalValue > 0 && gst > 0 && (totalAmount === 0 || Math.abs((metalValue + gst) - totalAmount) > 1)) {
        totalAmount = Math.round((metalValue + gst) * 100) / 100;
      } else if (totalAmount > 0 && metalValue === 0) {
        metalValue = Math.round((totalAmount / 1.03) * 100) / 100;
        gst = Math.round((totalAmount - metalValue) * 100) / 100;
      }

      let ratePerGram = 0;
      const rateMatch = text.match(/Rate\s*of\s*(?:silver|gold)\/g[^\d]*([\d,]+\.?\d*)/i);
      const expectedRate = (metalValue > 0 && weightGrams > 0) ? (metalValue / weightGrams) : null;
      if (rateMatch) {
        ratePerGram = cleanCurrency(rateMatch[1], expectedRate);
      }
      if (expectedRate && (ratePerGram === 0 || Math.abs(ratePerGram - expectedRate) / expectedRate > 0.08)) {
        ratePerGram = Math.round(expectedRate * 100) / 100;
      }

      return {
        metal,
        provider,
        date: dateStr,
        time: timeStr,
        ratePerGram: Number(ratePerGram.toFixed(2)),
        weightGrams: Number(weightGrams.toFixed(4)),
        metalValue: Number(metalValue.toFixed(2)),
        gst: Number(gst.toFixed(2)),
        totalAmount: Number(totalAmount.toFixed(2)),
        transactionId: transactionId || `MANUAL-${Date.now()}`
      };
    }

    function repairSavedTimestamps(txList) {
      if (!Array.isArray(txList)) return [];
      return txList.map(tx => {
        const decoded = decodePhonePeTxTimestamp(tx.transactionId);
        if (decoded && (!tx.time || tx.time === "12:00 pm")) {
          return { ...tx, date: decoded.date, time: decoded.time };
        }
        return tx;
      });
    }

    function App() {
      // Fresh empty transaction state (hashes are derived dynamically from active transactions!)
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem(STORAGE_TX_KEY);
        return saved ? repairSavedTimestamps(JSON.parse(saved)) : [];
      });

      const [syncPassword, setSyncPassword] = useState(() => localStorage.getItem(STORAGE_PWD_KEY) || "");
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [syncStatus, setSyncStatus] = useState("idle");
      const [syncMsg, setSyncMsg] = useState("");

      const [activeMetal, setActiveMetal] = useState("Silver");
      const [unitMode, setUnitMode] = useState("both");
      const [activeTab, setActiveTab] = useState("dashboard");
      const [liveRates, setLiveRates] = useState({ Silver: 201.89, Gold: 14487.58 });
      const [scanQueue, setScanQueue] = useState([]);
      const [monthlySip, setMonthlySip] = useState(500);
      const [forecastMonths, setForecastMonths] = useState(6);

      useEffect(() => {
        localStorage.setItem(STORAGE_TX_KEY, JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem(STORAGE_PWD_KEY, syncPassword);
      }, [syncPassword]);

      async function getPasswordHash(password) {
        const cleanPwd = password.trim();
        const msgUint8 = new TextEncoder().encode("bullion-vault-salt-v2-" + cleanPwd);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 32);
      }

      // Auto-provisioning JSON storage bin on the fly tied to your SHA-256 password hash (Zero 404s, Zero API Keys)
      const syncWithPasswordCloud = async (txs, mode = "push", showAlert = true) => {
        if (!syncPassword || syncPassword.trim().length < 4) {
          if (showAlert) {
            setSyncStatus("error");
            setSyncMsg("Please enter a password of at least 4 characters.");
          }
          return;
        }
        setSyncStatus("syncing");
        setSyncMsg(mode === "push" ? "Provisioning cloud bin & uploading portfolio..." : "Downloading portfolio from cloud bin...");

        try {
          const binKey = await getPasswordHash(syncPassword);
          const topicChannel = `bv_sync_bin_${binKey}`;

          if (mode === "push") {
            const repairedTxs = repairSavedTimestamps(txs);
            const payloadStr = JSON.stringify({
              updatedAt: new Date().toISOString(),
              transactions: repairedTxs
            });

            // 1. Provision a fresh JSONBlob storage bin on the fly if Payload > 3KB, or push directly
            let blobUrl = localStorage.getItem(`bv_blob_url_${binKey}`) || "";
            let storedInBlob = false;

            try {
              if (blobUrl) {
                const putRes = await fetch(blobUrl, {
                  method: "PUT",
                  headers: { "Content-Type": "application/json", "Accept": "application/json" },
                  body: payloadStr
                });
                if (putRes.ok) storedInBlob = true;
              }
              if (!storedInBlob) {
                const postRes = await fetch("https://jsonblob.com/api/jsonBlob", {
                  method: "POST",
                  headers: { "Content-Type": "application/json", "Accept": "application/json" },
                  body: payloadStr
                });
                if (postRes.ok) {
                  const loc = postRes.headers.get("Location") || postRes.headers.get("location") || postRes.headers.get("X-jsonblob");
                  if (loc) {
                    blobUrl = loc.startsWith("http") ? loc : `https://jsonblob.com/api/jsonBlob/${loc.split("/").pop()}`;
                    blobUrl = blobUrl.replace(/^http:/, "https:");
                    localStorage.setItem(`bv_blob_url_${binKey}`, blobUrl);
                    storedInBlob = true;
                  }
                }
              }
            } catch (_) {
              // Fallback to direct relay payload if JSONBlob CORS is blocked on a specific network
            }

            // 2. Broadcast the auto-provisioned bin pointer + full JSON backup to the deterministic SHA-256 channel
            // Ntfy.sh automatically provisions any topic channel on the fly with zero 404s and 100% CORS support
            const relayPacket = JSON.stringify({
              updatedAt: new Date().toISOString(),
              blobUrl: storedInBlob ? blobUrl : null,
              transactions: repairedTxs
            });

            const res = await fetch(`${CLOUD_SYNC_RELAY}/${topicChannel}`, {
              method: "POST",
              body: relayPacket
            });

            if (!res.ok) throw new Error(`Cloud Push Failed (HTTP ${res.status})`);

            setSyncStatus("success");
            setSyncMsg(`✓ Pushed ${repairedTxs.length} transactions to Cloud! Now click "Pull from Cloud" on your mobile.`);
          } else {
            // Pull latest snapshot from the deterministic SHA-256 channel
            const res = await fetch(`${CLOUD_SYNC_RELAY}/${topicChannel}/json?poll=1&since=all`, {
              method: "GET"
            });

            if (!res.ok) throw new Error(`Cloud Pull Failed (HTTP ${res.status})`);

            const rawLines = (await res.text()).trim();
            if (!rawLines) {
              throw new Error("No cloud data found for this password yet. Click 'Save & Push Sync' on your primary device first!");
            }

            const lines = rawLines.split("\n").filter(Boolean);
            let latestData = null;

            for (let i = lines.length - 1; i >= 0; i--) {
              try {
                const event = JSON.parse(lines[i]);
                if (event.event === "message" && event.message) {
                  const parsedMsg = JSON.parse(event.message);
                  if (parsedMsg && (Array.isArray(parsedMsg.transactions) || parsedMsg.blobUrl)) {
                    latestData = parsedMsg;
                    break;
                  }
                }
              } catch (_) {}
            }

            if (!latestData) {
              throw new Error("No cloud data found for this password yet. Click 'Save & Push Sync' on your primary device first!");
            }

            let pulledTxs = latestData.transactions;

            // If a JSONBlob bin pointer was attached, fetch from the bin first with automatic fallback to inline transactions
            if (latestData.blobUrl) {
              try {
                const blobRes = await fetch(latestData.blobUrl, { headers: { "Accept": "application/json" } });
                if (blobRes.ok) {
                  const blobJson = await blobRes.json();
                  if (blobJson && Array.isArray(blobJson.transactions)) {
                    pulledTxs = blobJson.transactions;
                    localStorage.setItem(`bv_blob_url_${binKey}`, latestData.blobUrl);
                  }
                }
              } catch (_) {}
            }

            if (!Array.isArray(pulledTxs)) throw new Error("Invalid cloud data format.");

            const repaired = repairSavedTimestamps(pulledTxs);
            setTransactions(repaired);
            setSyncStatus("success");
            setSyncMsg(`✓ Pulled ${repaired.length} transactions from Cloud!`);
          }
        } catch (err) {
          setSyncStatus("error");
          setSyncMsg(err.message);
        }
      };

      const clearAllData = () => {
        if (!window.confirm("Clear all saved transactions and reset scan queue?")) return;
        localStorage.removeItem(STORAGE_TX_KEY);
        setTransactions([]);
        setScanQueue([]);
      };

      const formatWeight = (grams) => {
        const mg = grams * 1000;
        if (unitMode === "g") return `${grams.toFixed(4)} g`;
        if (unitMode === "mg") return `${mg.toFixed(2)} mg`;
        return `${grams.toFixed(4)} g (${mg.toFixed(1)} mg)`;
      };

      // Checks duplicate ONLY against currently active transactions in your ledger
      const checkDuplicate = (candidate, hash = null) => {
        for (const tx of transactions) {
          if (hash && tx.fileHash && tx.fileHash === hash) {
            return { isDup: true, reason: "Already in Portfolio (Exact Image Match)" };
          }
          if (candidate.transactionId && !candidate.transactionId.startsWith("MANUAL") && tx.transactionId === candidate.transactionId) {
            return { isDup: true, reason: `Duplicate PhonePe ID (${candidate.transactionId})` };
          }
          const sameSig =
            tx.metal === candidate.metal &&
            tx.date === candidate.date &&
            tx.time === candidate.time &&
            Math.abs(tx.weightGrams - candidate.weightGrams) < 0.00001 &&
            Math.abs(tx.totalAmount - candidate.totalAmount) < 0.01;
          if (sameSig) {
            return { isDup: true, reason: `Duplicate Receipt (${candidate.date} ${candidate.time})` };
          }
        }
        return { isDup: false, reason: null };
      };

      const handleFilesUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        setActiveTab("scanner");

        const batchSeenTxIds = new Set();
        const batchSeenHashes = new Set();

        for (const file of files) {
          const queueId = `scan-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
          const previewUrl = URL.createObjectURL(file);
          const hash = await computeFileHash(file);

          setScanQueue(prev => [{
            id: queueId,
            fileName: file.name,
            previewUrl,
            status: "scanning",
            progress: 0,
            extracted: null,
            dupInfo: null
          }, ...prev]);

          try {
            const result = await Tesseract.recognize(file, "eng", {
              logger: m => {
                if (m.status === "recognizing text") {
                  setScanQueue(prev => prev.map(item =>
                    item.id === queueId ? { ...item, progress: Math.round(m.progress * 100) } : item
                  ));
                }
              }
            });

            const parsed = parsePhonePeOCRText(result.data.text, file.name);
            let dupCheck = checkDuplicate(parsed, hash);

            if (!dupCheck.isDup) {
              if (batchSeenHashes.has(hash)) {
                dupCheck = { isDup: true, reason: "Duplicate File in Current Upload Batch" };
              } else if (parsed.transactionId && !parsed.transactionId.startsWith("MANUAL") && batchSeenTxIds.has(parsed.transactionId)) {
                dupCheck = { isDup: true, reason: `Duplicate PhonePe ID in Batch (${parsed.transactionId})` };
              }
            }

            batchSeenHashes.add(hash);
            if (parsed.transactionId && !parsed.transactionId.startsWith("MANUAL")) {
              batchSeenTxIds.add(parsed.transactionId);
            }

            setScanQueue(prev => prev.map(item =>
              item.id === queueId
                ? {
                    ...item,
                    status: dupCheck.isDup ? "duplicate" : "ready",
                    progress: 100,
                    extracted: { ...parsed, fileHash: hash },
                    dupInfo: dupCheck.reason
                  }
                : item
            ));
          } catch (err) {
            setScanQueue(prev => prev.map(item =>
              item.id === queueId ? { ...item, status: "error", dupInfo: err.message } : item
            ));
          }
        }
        e.target.value = "";
      };

      const approveScannedItem = (queueItem, forceOverride = false) => {
        const ext = queueItem.extracted;
        if (!forceOverride) {
          const dupCheck = checkDuplicate(ext, ext.fileHash);
          if (dupCheck.isDup) {
            alert(`Blocked: ${dupCheck.reason}`);
            return;
          }
        }
        const newTx = {
          ...ext,
          id: `tx-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          source: "Verified Browser OCR"
        };
        const updatedTxs = [newTx, ...transactions];
        setTransactions(updatedTxs);
        setActiveMetal(ext.metal);
        if (ext.ratePerGram > 0) {
          setLiveRates(prev => ({ ...prev, [ext.metal]: ext.ratePerGram }));
        }
        setScanQueue(prev => prev.map(i => i.id === queueItem.id ? { ...i, status: "saved" } : i));

        if (syncPassword && syncPassword.trim().length >= 4) {
          syncWithPasswordCloud(updatedTxs, "push", false);
        }
      };

      const updateScannedField = (queueId, field, value) => {
        setScanQueue(prev => prev.map(item => {
          if (item.id !== queueId) return item;
          const updated = { ...item.extracted, [field]: value };
          if (field === "transactionId") {
            const decoded = decodePhonePeTxTimestamp(value);
            if (decoded) {
              updated.date = decoded.date;
              updated.time = decoded.time;
            }
          }
          const dupCheck = checkDuplicate(updated, updated.fileHash);
          return {
            ...item,
            extracted: updated,
            status: dupCheck.isDup ? "duplicate" : "ready",
            dupInfo: dupCheck.reason
          };
        }));
      };

      const metalTxs = useMemo(() => {
        return transactions
          .filter(t => t.metal === activeMetal)
          .sort((a, b) => `${a.date}T${to24HourTime(a.time)}`.localeCompare(`${b.date}T${to24HourTime(b.time)}`));
      }, [transactions, activeMetal]);

      const stats = useMemo(() => {
        const totalWeight = metalTxs.reduce((s, t) => s + Number(t.weightGrams), 0);
        const totalPaid = metalTxs.reduce((s, t) => s + Number(t.totalAmount), 0);
        const totalMetalValue = metalTxs.reduce((s, t) => s + Number(t.metalValue), 0);
        const totalGst = metalTxs.reduce((s, t) => s + Number(t.gst), 0);
        const weightedAvgRate = totalWeight > 0 ? totalMetalValue / totalWeight : 0;
        const breakEvenRate = totalWeight > 0 ? totalPaid / totalWeight : 0;
        const currentVal = totalWeight * (liveRates[activeMetal] || weightedAvgRate);
        const netPnL = currentVal - totalPaid;
        return { totalWeight, totalPaid, totalMetalValue, totalGst, weightedAvgRate, breakEvenRate, currentVal, netPnL, count: metalTxs.length };
      }, [metalTxs, liveRates, activeMetal]);

        const n = rates.length;

        const slope = n >= 2 ? (rates[n - 1] - rates[0]) / (n - 1) : 0;
        const projectedRate = Math.max(avgRate * 0.7, rates[n - 1] + slope * forecastMonths * 1.5);
        const futureInvested = monthlySip * forecastMonths;
        const futureGrams = stats.totalWeight + (futureInvested * 0.97) / ((projectedRate + rates[n - 1]) / 2);
        const projectedValue = futureGrams * projectedRate;
        return { projectedRate, futureGrams, projectedValue, futureInvested };
      }, [metalTxs, stats, monthlySip, forecastMonths]);

                              <div>
                                <label className="text-[10px] text-slate-400">Total Paid (₹)</label>
                                <input type="number" step="0.01" value={item.extracted.totalAmount} onChange={e => updateScannedField(item.id, "totalAmount", parseFloat(e.target.value) || 0)} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-white font-bold" />
                              </div>
                              <div className="sm:col-span-2">
                                <label className="text-[10px] text-slate-400">PhonePe Txn ID</label>
                                <input type="text" value={item.extracted.transactionId} onChange={e => updateScannedField(item.id, "transactionId", e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-slate-300 font-mono text-[11px]" />
                              </div>
                            </div>
                          )}

                          <div className="flex justify-end gap-2 pt-1">
                            {item.status === "duplicate" && (
                              <button onClick={() => approveScannedItem(item, true)} className="bg-amber-600/80 hover:bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl">
                                Force Allow & Save
                              </button>
                            )}
                            {item.status === "ready" && (
                              <button onClick={() => approveScannedItem(item, false)} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-xl shadow">
                                ✓ Save to Portfolio
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {activeTab === "ledger" && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                {transactions.length === 0 ? (
                  <div className="p-10 text-center text-slate-400 text-sm">Your purchase history is empty. Upload a PhonePe screenshot to begin tracking!</div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="bg-slate-950 text-slate-400 border-b border-slate-800">
                          <th className="p-3.5">Date & Time</th>
                          <th className="p-3.5">Metal / Provider</th>
                          <th className="p-3.5">Buy Rate/g</th>
                          <th className="p-3.5">Quantity (g / mg)</th>
                          <th className="p-3.5">Value + GST</th>
                          <th className="p-3.5">Total Paid</th>
                          <th className="p-3.5">PhonePe Transaction ID</th>
                          <th className="p-3.5 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/70">
                        {transactions.map(tx => (
                          <tr key={tx.id} className="hover:bg-slate-800/40">
                            <td className="p-3.5 font-semibold text-white">{tx.date} <span className="text-indigo-300 font-medium ml-1">{tx.time}</span></td>
                            <td className="p-3.5">
                              <span className={`px-2 py-0.5 rounded font-bold ${tx.metal === "Gold" ? "bg-amber-500/20 text-amber-300" : "bg-slate-700 text-slate-200"}`}>{tx.metal}</span>
                              <span className="ml-1.5 text-slate-400">{tx.provider}</span>
                            </td>
                            <td className="p-3.5 font-bold text-amber-400">₹{tx.ratePerGram.toFixed(2)}/g</td>
                            <td className="p-3.5 font-semibold text-emerald-400">{formatWeight(tx.weightGrams)}</td>
                            <td className="p-3.5 text-slate-300">₹{tx.metalValue.toFixed(2)} + ₹{tx.gst.toFixed(2)}</td>
                            <td className="p-3.5 font-bold text-white">₹{tx.totalAmount.toFixed(2)}</td>
                            <td className="p-3.5 font-mono text-[11px] text-slate-400">{tx.transactionId}</td>
                            <td className="p-3.5 text-right">
                              <button onClick={() => setTransactions(prev => prev.filter(i => i.id !== tx.id))} className="text-rose-400 hover:text-rose-300 font-semibold">Delete</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
