<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BullionVault — Gold & Silver Micro Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    async function computeFileHash(file) {
      const buffer = await file.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function parsePhonePeOCRText(rawText) {
      const text = rawText.replace(/\r/g, " ");
      const metal = /Gold\s*Purchase|Rate\s*of\s*gold|Gold\s*Weight/i.test(text) ? "Gold" : "Silver";
      const provider = /MMTC[\s-]*PAMP/i.test(text) ? "MMTC-PAMP" : "SafeGold";

      let dateStr = new Date().toISOString().slice(0, 10);
      let timeStr = "12:00 pm";
      const timeMatch = text.match(/(\d{1,2}:\d{2}\s*(?:am|pm))/i);
      if (timeMatch) timeStr = timeMatch[1].toLowerCase();

      const dateMatch = text.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{4})/i);
      if (dateMatch) {
        const months = { jan:"01", feb:"02", mar:"03", apr:"04", may:"05", jun:"06", jul:"07", aug:"08", sep:"09", oct:"10", nov:"11", dec:"12" };
        dateStr = `${dateMatch[3]}-${months[dateMatch[2].toLowerCase().slice(0, 3)] || "01"}-${dateMatch[1].padStart(2, "0")}`;
      }

      const txIdMatch = text.match(/\b(NB\d{18,28}|T\d{18,28})\b/i);
      const transactionId = txIdMatch ? txIdMatch[1].toUpperCase() : `MANUAL-${Date.now()}`;

      let weightGrams = 0;
      const weightMatch = text.match(/(?:Weight|weight)[^\d]*?(0\.\d{2,5})\s*g/i) || text.match(/\b(0\.\d{3,5})\s*g\b/i);
      if (weightMatch) weightGrams = parseFloat(weightMatch[1]);

      let totalAmount = 0;
      const totalMatch = text.match(/Total\s*amount[^\d]*([\d,]+\.?\d*)/i);
      if (totalMatch) {
        totalAmount = parseFloat(totalMatch[1].replace(/,/g, ""));
        if (totalAmount > 200 && [210, 220, 230, 240, 250, 710, 720, 730, 740, 750].includes(totalAmount)) {
          totalAmount = totalAmount % 100;
        }
      }

      let gst = 0;
      const gstMatch = text.match(/GST[^\d]*([\d]+\.\d{2})/i);
      if (gstMatch) {
        gst = parseFloat(gstMatch[1]);
        if (gst > 10 && (String(gst).startsWith("2") || String(gst).startsWith("7"))) gst = parseFloat(String(gst).slice(1));
      }

      let metalValue = totalAmount > 0 && gst > 0 ? Math.round((totalAmount - gst) * 100) / 100 : Math.round((totalAmount / 1.03) * 100) / 100;
      if (gst === 0 && totalAmount > 0) gst = Math.round((totalAmount - metalValue) * 100) / 100;

      let ratePerGram = weightGrams > 0 ? Math.round((metalValue / weightGrams) * 100) / 100 : 0;
      const rateMatch = text.match(/Rate\s*of\s*(?:silver|gold)\/g[^\d]*([\d,]+\.?\d*)/i);
      if (rateMatch) {
        const cleanedRate = parseFloat(rateMatch[1].replace(/[,₹Rs\s]/gi, ""));
        if (!isNaN(cleanedRate) && Math.abs(cleanedRate - ratePerGram) / ratePerGram < 0.15) ratePerGram = cleanedRate;
      }

      return { metal, provider, date: dateStr, time: timeStr, ratePerGram, weightGrams, metalValue, gst, totalAmount, transactionId };
    }

    function App() {
      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem("bv_txs_v2") || "[]"));
      const [fileHashes, setFileHashes] = useState(() => JSON.parse(localStorage.getItem("bv_hashes_v2") || "[]"));
      const [syncPassword, setSyncPassword] = useState(() => localStorage.getItem("bv_pwd") || "");
      const [showModal, setShowModal] = useState(false);
      const [activeMetal, setActiveMetal] = useState("Silver");
      const [unitMode, setUnitMode] = useState("both");
      const [activeTab, setActiveTab] = useState("dashboard");
      const [liveRates, setLiveRates] = useState({ Silver: 201.89, Gold: 14487.58 });
      const [scanQueue, setScanQueue] = useState([]);

      useEffect(() => {
        localStorage.setItem("bv_txs_v2", JSON.stringify(transactions));
        localStorage.setItem("bv_hashes_v2", JSON.stringify(fileHashes));
        localStorage.setItem("bv_pwd", syncPassword);
      }, [transactions, fileHashes, syncPassword]);

      const formatWeight = (g) => unitMode === "g" ? `${g.toFixed(4)} g` : unitMode === "mg" ? `${(g * 1000).toFixed(1)} mg` : `${g.toFixed(4)} g (${(g * 1000).toFixed(1)} mg)`;

      const checkDup = (cand, hash) => {
        if (hash && fileHashes.includes(hash)) return "Duplicate Screenshot File";
        if (cand.transactionId && !cand.transactionId.startsWith("MANUAL") && transactions.some(t => t.transactionId === cand.transactionId)) return "Duplicate PhonePe Transaction ID";
        return null;
      };

      const handleUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        setActiveTab("scanner");
        for (const file of files) {
          const id = `scan-${Math.random()}`;
          const hash = await computeFileHash(file);
          const previewUrl = URL.createObjectURL(file);
          setScanQueue(prev => [{ id, fileName: file.name, previewUrl, status: "scanning", progress: 0, extracted: null, hash }, ...prev]);

          try {
            const res = await Tesseract.recognize(file, "eng", { logger: m => {
              if (m.status === "recognizing text") setScanQueue(q => q.map(i => i.id === id ? { ...i, progress: Math.round(m.progress * 100) } : i));
            }});
            const extracted = parsePhonePeOCRText(res.data.text);
            const dup = checkDup(extracted, hash);
            setScanQueue(q => q.map(i => i.id === id ? { ...i, status: dup ? "duplicate" : "ready", progress: 100, extracted, dupInfo: dup } : i));
          } catch (err) {
            setScanQueue(q => q.map(i => i.id === id ? { ...i, status: "error", dupInfo: err.message } : i));
          }
        }
        e.target.value = "";
      };

      const approve = (item) => {
        if (checkDup(item.extracted, item.hash)) { alert("Blocked duplicate!"); return; }
        setTransactions(prev => [{ ...item.extracted, id: `tx-${Date.now()}` }, ...prev]);
        if (item.hash) setFileHashes(prev => [...prev, item.hash]);
        setActiveMetal(item.extracted.metal);
        setLiveRates(prev => ({ ...prev, [item.extracted.metal]: item.extracted.ratePerGram }));
        setScanQueue(q => q.map(i => i.id === item.id ? { ...i, status: "saved" } : i));
      };

      const stats = useMemo(() => {
        const txs = transactions.filter(t => t.metal === activeMetal);
        const w = txs.reduce((s, t) => s + t.weightGrams, 0);
        const paid = txs.reduce((s, t) => s + t.totalAmount, 0);
        const val = txs.reduce((s, t) => s + t.metalValue, 0);
        const avg = w > 0 ? val / w : 0;
        const curVal = w * (liveRates[activeMetal] || avg);
        return { w, paid, avg, curVal, count: txs.length };
      }, [transactions, activeMetal, liveRates]);

      return (
        <div className="min-h-screen pb-12">
          <header className="sticky top-0 z-30 bg-slate-900/90 border-b border-slate-800 px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-amber-500 font-bold text-slate-950 flex items-center justify-center">Au</div>
              <h1 className="font-bold text-sm sm:text-base">BullionVault Tracker</h1>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <button onClick={() => setShowModal(true)} className="px-3 py-1.5 rounded-xl text-xs bg-slate-800 border border-slate-700 text-emerald-400 font-semibold">
                🔐 {syncPassword ? "Sync Active" : "Set Password"}
              </button>
              <div className="bg-slate-800 p-1 rounded-xl flex text-xs">
                {["Silver", "Gold"].map(m => (
                  <button key={m} onClick={() => setActiveMetal(m)} className={`px-3 py-1 rounded-lg ${activeMetal === m ? "bg-amber-500 text-slate-950 font-bold" : "text-slate-400"}`}>{m}</button>
                ))}
              </div>
              <label className="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl">
                + Upload Receipt
                <input type="file" accept="image/*" multiple onChange={handleUpload} className="hidden" />
              </label>
            </div>
          </header>

          {showModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-3">
                <h3 className="font-bold text-sm text-white">Password Sync Setup</h3>
                <input type="password" placeholder="Enter sync password" value={syncPassword} onChange={e => setSyncPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" />
                <button onClick={() => setShowModal(false)} className="w-full py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Save Password</button>
              </div>
            </div>
          )}

          <main className="max-w-5xl mx-auto px-4 pt-5 space-y-5">
            <div className="flex gap-2 border-b border-slate-800 pb-2 text-xs">
              {["dashboard", "scanner", "ledger"].map(t => (
                <button key={t} onClick={() => setActiveTab(t)} className={`px-3 py-1.5 rounded-lg capitalize ${activeTab === t ? "bg-slate-800 text-white font-bold" : "text-slate-400"}`}>{t}</button>
              ))}
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl"><p className="text-[11px] text-slate-400">Total {activeMetal}</p><p className="text-base font-bold text-white mt-1">{formatWeight(stats.w)}</p></div>
              <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl"><p className="text-[11px] text-slate-400">Avg Buy Rate</p><p className="text-base font-bold text-amber-400 mt-1">₹{stats.avg.toFixed(2)}/g</p></div>
              <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl"><p className="text-[11px] text-slate-400">Total Invested</p><p className="text-base font-bold text-white mt-1">₹{stats.paid.toFixed(2)}</p></div>
              <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl"><p className="text-[11px] text-slate-400">Portfolio Value</p><p className="text-base font-bold text-emerald-400 mt-1">₹{stats.curVal.toFixed(2)}</p></div>
            </div>

            {activeTab === "scanner" && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                <h2 className="font-bold text-sm">OCR Scan Queue</h2>
                {scanQueue.map(item => (
                  <div key={item.id} className="bg-slate-950 p-3 rounded-xl flex items-center justify-between text-xs gap-3">
                    <span className="font-semibold text-slate-300">{item.fileName}</span>
                    <span className={item.status === "ready" ? "text-emerald-400" : item.status === "duplicate" ? "text-rose-400" : "text-indigo-400"}>{item.status === "ready" ? "✓ Verified" : item.dupInfo || `${item.progress}%`}</span>
                    {item.status === "ready" && <button onClick={() => approve(item)} className="px-3 py-1 bg-emerald-600 text-white rounded-lg font-bold">Save</button>}
                  </div>
                ))}
              </div>
            )}

            {activeTab === "ledger" && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden text-xs">
                <table className="w-full text-left">
                  <tr className="bg-slate-950 text-slate-400 border-b border-slate-800"><th className="p-3">Date</th><th className="p-3">Metal</th><th className="p-3">Rate/g</th><th className="p-3">Weight</th><th className="p-3">Total</th><th className="p-3 text-right">Action</th></tr>
                  {transactions.map(tx => (
                    <tr key={tx.id} className="border-b border-slate-800/50">
                      <td className="p-3">{tx.date}</td><td className="p-3 font-bold">{tx.metal}</td><td className="p-3 text-amber-400">₹{tx.ratePerGram}</td><td className="p-3 text-emerald-400">{formatWeight(tx.weightGrams)}</td><td className="p-3">₹{tx.totalAmount}</td>
                      <td className="p-3 text-right"><button onClick={() => setTransactions(transactions.filter(t => t.id !== tx.id))} className="text-rose-400">Delete</button></td>
                    </tr>
                  ))}
                </table>
              </div>
            )}
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
